<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0a1118" />
    <meta name="description" content="Preview, arrange, and export artwork for your Steam profile before you make changes on Steam." />
    <meta name="robots" content="index,follow" />
    <meta name="google-adsense-account" content="ca-pub-4824777077254194" />
    <title>Steam Canvas 🖌️ — Steam Profile Editor</title>
    <script>
      const desktopViewport = window.matchMedia('(min-width: 651px)');
      const loadAdSense = () => {
        if (!desktopViewport.matches || document.querySelector('[data-adsense-loader]')) return;

        const script = document.createElement('script');
        script.async = true;
        script.dataset.adsenseLoader = 'true';
        script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4824777077254194';
        script.crossOrigin = 'anonymous';
        document.head.append(script);
      };

      loadAdSense();
      desktopViewport.addEventListener('change', loadAdSense);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
